name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the job only needs to read the repository
permissions:
  contents: read

# Never run two deploys against the server at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Third-party actions are pinned to full commit SHAs (tag shown for reference)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify required secrets
        # Secrets are passed through env and only tested for presence, never echoed
        env:
          PUBLIC_JAMENDO_CLIENT_ID: ${{ secrets.PUBLIC_JAMENDO_CLIENT_ID }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in PUBLIC_JAMENDO_CLIENT_ID FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build project
        run: npm run build
        env:
          PUBLIC_JAMENDO_CLIENT_ID: ${{ secrets.PUBLIC_JAMENDO_CLIENT_ID }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp instead of FTP-Deploy-Action: Hostinger resets the action's data
      # connections. lftp uses classic PASV, one connection at a time, with retries.
      - name: Deploy to Hostinger via FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set ftp:prefer-epsv no
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --only-newer --parallel=1 --verbose \
            --exclude-glob .git* --exclude-glob node_modules/ \
            dist/ public_html/
          bye
          EOF
